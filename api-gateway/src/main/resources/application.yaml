server:
  port: 9099

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    # other eureka service by default true

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: "*"

  info:
    env:
      enabled: true

info:
  app:
  name: "Api Gateway"
  description: "This is api gateway for common entry point"
  version: "1.0V"


